<div class="relative min-h-screen flex flex-col bg-background antialiased selection:bg-primary/20">
  <!-- Global Top Progress Loading Bar -->
  @if (loadingService.isLoading()) {
    <div class="fixed top-0 left-0 right-0 h-1 bg-primary/10 z-[100] overflow-hidden">
      <div class="h-full bg-primary w-1/3 animate-loading-bar rounded-full"></div>
    </div>
  }

  <!-- View Port -->
  <router-outlet></router-outlet>

  <!-- Global Toasts & Real-time iOS Notifications -->
  <app-toast></app-toast>
  <app-notification-toast></app-notification-toast>
</div>
