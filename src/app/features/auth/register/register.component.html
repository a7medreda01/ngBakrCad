<div class="flex flex-col gap-6">

  <!-- Back to Home -->
  <a routerLink="/" class="inline-flex items-center gap-2 text-xs font-bold text-text-secondary hover:text-primary transition duration-200 group w-fit">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5 group-hover:-translate-x-0.5 transition-transform">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
    </svg>
    {{ 'auth.backHome' | translate }}
  </a>

  <!-- Header -->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-extrabold text-secondary">{{ 'auth.register' | translate }}</h2>
    <p class="text-sm text-text-secondary">{{ 'auth.welcomeRegister' | translate }}</p>
  </div>

  <!-- Account Type Selector -->
  <div class="grid grid-cols-2 gap-3">
    <button
      type="button"
      (click)="selectType('client')"
      [class.border-primary]="selectedType() === 'client'"
      [class.bg-primary/5]="selectedType() === 'client'"
      class="flex flex-col items-center gap-2 p-4 rounded-2xl border-2 border-border text-center transition-all duration-200 hover:border-primary/50"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7 text-primary">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
      </svg>
      <div>
        <p class="text-xs font-black text-secondary">{{ 'auth.accountTypeDoctor' | translate }}</p>
        <p class="text-[10px] text-text-secondary">{{ 'auth.accountTypeDoctorDesc' | translate }}</p>
      </div>
    </button>

    <button
      type="button"
      (click)="selectType('lab')"
      [class.border-primary]="selectedType() === 'lab'"
      [class.bg-primary/5]="selectedType() === 'lab'"
      class="flex flex-col items-center gap-2 p-4 rounded-2xl border-2 border-border text-center transition-all duration-200 hover:border-primary/50"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7 text-primary">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 0 1-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 0 1 4.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0 1 12 15a9.065 9.065 0 0 1-6.23-.693L4.2 13.914" />
      </svg>
      <div>
        <p class="text-xs font-black text-secondary">{{ 'auth.accountTypeLab' | translate }}</p>
        <p class="text-[10px] text-text-secondary">{{ 'auth.accountTypeLabDesc' | translate }}</p>
      </div>
    </button>
  </div>

  <!-- Registration Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-secondary">{{ 'auth.fullname' | translate }}</label>
        <input id="reg-fullname" type="text" formControlName="fullName" placeholder="الاسم الكامل"
          class="w-full px-4 py-3 rounded-xl border border-border bg-background text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-200"
          [class.border-red-400]="form.get('fullName')?.invalid && form.get('fullName')?.touched" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-secondary">{{ 'auth.phone' | translate }}</label>
        <input id="reg-phone" type="tel" formControlName="phoneNumber" placeholder="+966XXXXXXXXX"
          class="w-full px-4 py-3 rounded-xl border border-border bg-background text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-200"
          [class.border-red-400]="form.get('phoneNumber')?.invalid && form.get('phoneNumber')?.touched" />
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-bold text-secondary">{{ 'auth.email' | translate }}</label>
      <input id="reg-email" type="email" formControlName="email" placeholder="example@dental.com"
        class="w-full px-4 py-3 rounded-xl border border-border bg-background text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-200"
        [class.border-red-400]="form.get('email')?.invalid && form.get('email')?.touched" />
    </div>

    @if (selectedType() === 'client') {
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-secondary">{{ 'auth.clinicName' | translate }}</label>
        <input id="reg-clinic" type="text" formControlName="clinicName" placeholder="اسم العيادة أو المركز"
          class="w-full px-4 py-3 rounded-xl border border-border bg-background text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-200" />
      </div>
    }

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-secondary">{{ 'auth.country' | translate }}</label>
        <app-country-select id="reg-country" formControlName="country" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-secondary">{{ 'auth.city' | translate }}</label>
        <input id="reg-city" type="text" formControlName="city" placeholder="الرياض"
          class="w-full px-4 py-3 rounded-xl border border-border bg-background text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-200" />
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-bold text-secondary">{{ 'auth.password' | translate }}</label>
      <div class="relative">
        <input id="reg-password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="8 أحرف على الأقل"
          class="w-full px-4 py-3 rounded-xl border border-border bg-background text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-200 pe-12"
          [class.border-red-400]="form.get('password')?.invalid && form.get('password')?.touched" />
        <button type="button" (click)="showPassword.set(!showPassword())" class="absolute top-1/2 -translate-y-1/2 end-3 text-text-secondary hover:text-secondary p-1 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.43 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
        </button>
      </div>
    </div>

    <app-button type="submit" [isLoading]="isLoading()" size="lg" class="w-full mt-2">
      {{ 'auth.submitCreate' | translate }}
    </app-button>
  </form>

  <div class="text-center">
    <span class="text-sm text-text-secondary">{{ 'auth.hasAccount' | translate }}</span>
    <a routerLink="/auth/login" class="text-sm font-bold text-primary hover:underline ms-1">{{ 'auth.loginLink' | translate }}</a>
  </div>
</div>
