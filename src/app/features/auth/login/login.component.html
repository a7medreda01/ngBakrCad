<div class="flex flex-col gap-8">
  <!-- Header -->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-extrabold text-secondary">{{ 'auth.login' | translate }}</h2>
    <p class="text-sm text-text-secondary">أهلاً بك في منصة BKR CAD. سجل دخولك للمتابعة.</p>
  </div>

  <!-- Login Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <!-- Email Field -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-bold text-secondary">{{ 'auth.email' | translate }}</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        placeholder="example@dental.com"
        class="w-full px-4 py-3 rounded-xl border border-border bg-background text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-200"
        [class.border-red-400]="form.get('email')?.invalid && form.get('email')?.touched"
      />
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <span class="text-xs text-red-500 font-semibold">يرجى إدخال بريد إلكتروني صحيح</span>
      }
    </div>

    <!-- Password Field -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-bold text-secondary">{{ 'auth.password' | translate }}</label>
      <div class="relative">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl border border-border bg-background text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition duration-200 pe-12"
          [class.border-red-400]="form.get('password')?.invalid && form.get('password')?.touched"
        />
        <button type="button" (click)="showPassword.set(!showPassword())" class="absolute top-1/2 -translate-y-1/2 end-3 text-text-secondary hover:text-secondary p-1 rounded-lg">
          @if (showPassword()) {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.43 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
          }
        </button>
      </div>
    </div>

    <!-- Forgot Password Link -->
    <div class="text-end">
      <a routerLink="/auth/forgot-password" class="text-xs font-bold text-primary hover:underline">{{ 'auth.forgot' | translate }}</a>
    </div>

    <!-- Submit Button -->
    <app-button type="submit" [isLoading]="isLoading()" size="lg" class="w-full">
      {{ 'auth.login' | translate }}
    </app-button>
  </form>

  <!-- Register Redirect -->
  <div class="text-center">
    <span class="text-sm text-text-secondary">{{ 'auth.noAccount' | translate }}</span>
    <a routerLink="/auth/register" class="text-sm font-bold text-primary hover:underline ms-1">إنشاء حساب</a>
  </div>
</div>
