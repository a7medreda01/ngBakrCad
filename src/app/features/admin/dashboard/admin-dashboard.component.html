<div class="flex flex-col gap-6" [dir]="i18n.isRtl() ? 'rtl' : 'ltr'">
  <!-- Header -->
  <div class="border-b border-border pb-4">
    <h1 class="text-xl font-extrabold text-secondary">{{ t('portal.admin') }}</h1>
    <p class="text-xs text-text-secondary mt-1">لوحة تحكم المشرف العام لمراقبة العمليات المالية وطلبات الأسنان الرقمية</p>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <!-- Active Orders -->
    <div class="bg-surface rounded-2xl border border-border p-5 shadow-card flex flex-col gap-3">
      <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-primary"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" /></svg>
      </div>
      <div>
        @if (isLoading()) {
          <div class="h-7 w-12 bg-slate-200 animate-pulse rounded-lg"></div>
        } @else {
          <p class="text-2xl font-black text-secondary">{{ activeOrdersCount() }}</p>
        }
        <p class="text-xs font-bold text-text-secondary mt-1">الطلبات النشطة بالنظام</p>
      </div>
    </div>

    <!-- Active Designers -->
    <div class="bg-surface rounded-2xl border border-border p-5 shadow-card flex flex-col gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-blue-500"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg>
      </div>
      <div>
        <p class="text-2xl font-black text-secondary">{{ designersCount() }}</p>
        <p class="text-xs font-bold text-text-secondary mt-1">المصممون والترجمة النشطون</p>
      </div>
    </div>

    <!-- Total Revenue -->
    <div class="bg-surface rounded-2xl border border-border p-5 shadow-card flex flex-col gap-3">
      <div class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-green-500"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.075m-.75 0a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 .75.75v.075m-18 0A26.95 26.95 0 0 0 3 12c0 1.268.087 2.513.255 3.732M3.75 4.5c.036-.312.086-.62.15-1.026m0 0A2.25 2.25 0 0 1 6 1.75h12A2.25 2.25 0 0 1 20.1 3.474m-16.2 0A26.95 26.95 0 0 1 12 4.5c2.783 0 5.48-.42 8.04-1.226m0 0a24.9 24.9 0 0 1 .15 1.026M20.25 4.5c.036.312.086.62.15 1.026m0 0a27.15 27.15 0 0 0-3.3-3.732m-13.8 0A27.15 27.15 0 0 1 12 21.75c-3.15 0-6.18-.54-9-1.58M12 21.75c-2.783 0-5.48-.42-8.04-1.226M12 21.75c2.783 0 5.48-.42 8.04-1.226" /></svg>
      </div>
      <div>
        <p class="text-2xl font-black text-secondary">{{ totalRevenue() }} SAR</p>
        <p class="text-xs font-bold text-text-secondary mt-1">إجمالي الإيرادات المالية</p>
      </div>
    </div>
  </div>
</div>
