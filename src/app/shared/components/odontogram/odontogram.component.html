    @if (!readOnly()) {
      <div class="flex gap-1.5">
        <button type="button" (click)="selectUpperArch()"

          <span>علوي</span>
        </button>
        <button type="button" (click)="selectLowerArch()"
          class="text-[11px] px-2.5 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 hover:bg-emerald-500/20 transition duration-200 font-extrabold flex items-center gap-1"
          title="تحديد جميع أسنان الفك السفلي">
          <span>سفلي</span>
        </button>
        <button type="button" (click)="clearAll()"

          title="إلغاء جميع التحديدات">
          <span>✕ مسح </span>
        </button>
      </div>
    }
  </div>

  <!-- Interactive Porcelain Odontogram Canvas — real anatomical tooth outlines -->
  <div class="odontogram-chart relative flex justify-center items-center py-1 bg-slate-900/5 rounded-3xl border border-border/60 shadow-inner overflow-hidden">

    <svg viewBox="0 0 478.6 817.16" xmlns="http://www.w3.org/2000/svg" class="odontogram-svg w-full h-auto select-none" [style.maxHeight]="height()">
      <!-- Side Orientation Labels — positioned like the source reference chart,
           vertically centered along the left/right edges of the arch. -->
      <text x="45.04" y="410.22" class="text-[26px] font-black fill-text-secondary select-none">R</text>
      <text x="398.5" y="413.22" class="text-[26px] font-black fill-text-secondary select-none">L</text>

      <!-- Midline Guide Ticks -->
      <line x1="239.3" y1="4" x2="239.3" y2="20" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
      <line x1="239.3" y1="798" x2="239.3" y2="814" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />

      <!-- Render All 32 Teeth using their REAL anatomical outlines (traced reference) -->
      @for (tooth of teeth(); track trackByNum($index, tooth)) {
        <g class="tooth-item transition-all duration-200 cursor-pointer group"
           [class.selected]="isToothSelected(tooth.num)"
           [class.committed]="isToothCommitted(tooth.num)"
           [class.read-only]="readOnly()"
           (click)="readOnly() ? null : toggleTooth(tooth.num)"
           role="button"
           [attr.tabindex]="0"
           [attr.aria-label]="'سن رقم ' + tooth.num">

          <!-- Anatomical Crown Group (raw traced coordinates, shared transform) —
               flat black-and-white line art: plain black outline, white fill by
               default, solid (non-gradient) color fill only when a tooth is
               selected/highlighted/committed. -->
          <g [attr.transform]="pathTransform">

            <!-- 1. Main Crown Outline — filled with state color -->
            <path [attr.d]="tooth.crown"
                  [attr.fill]="getToothFillColor(tooth.num)"
                  stroke="#000000"
                  [attr.stroke-width]="(isToothSelected(tooth.num) || isToothHighlighted(tooth.num) || isToothCommitted(tooth.num)) ? '1.6' : '1.1'"
                  stroke-linejoin="round"
                  class="tooth-crown transition-all duration-300">
            </path>

            <!-- 2. Fine Anatomical Detail Lines (grooves / cusps / shading) traced from reference -->
            @for (detail of tooth.details; track $index) {
              <path [attr.d]="detail"
                    fill="none"
                    stroke="#000000"
                    stroke-width="0.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    opacity="0.6">
              </path>
            }
          </g>

          <!-- Tooth Number Label — printed OUTSIDE the crown, at the same anchor
               points used by the original traced reference chart, so numbering
               reads like a normal odontogram (number sits beside the tooth, not
               on top of it). Stays plain/dark regardless of selection state. -->
          <text [attr.x]="tooth.labelX"
                [attr.y]="tooth.labelY"
                font-size="19"
                font-family="ArialNarrow, Arial, system-ui, sans-serif"
                fill="#1E293B"
                class="pointer-events-none select-none">
            {{ tooth.num }}
          </text>

          <!-- Overlap indicator — tooth is BOTH currently selected AND
               already committed to a previous service. Dashed gold ring. -->
          @if (isToothSelectedAndCommitted(tooth.num)) {
            <circle [attr.cx]="tooth.cx" [attr.cy]="tooth.cy" r="24"
                    fill="none" stroke="#FACC15" stroke-width="2.2"
                    stroke-dasharray="4,3" opacity="0.9"
                    class="pointer-events-none">
            </circle>
          }
        </g>
      }
    </svg>
  </div>
